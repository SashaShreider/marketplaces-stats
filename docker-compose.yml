services:
  postgres:
    image: postgres:17-alpine
    container_name: analizer-postgres
    environment:
      POSTGRES_DB: analizer
      POSTGRES_USER: analizer
      POSTGRES_PASSWORD: analizer
    ports:
      - "5433:5432"
    volumes:
      - analizer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analizer -d analizer"]
      interval: 5s
      timeout: 5s
      retries: 10

# Приложение: http://localhost:8080
  #
  # Тег образа задан явно, а не выводится compose из имени каталога. Без этого
  # сервер после получения образа из CI не знал бы, какой файл положить в докер:
  # имя вычислялось бы как «имя каталога-имя сервиса» и зависело бы от того, как
  # сервер называется. Явный тег снимает эту связь — образ, собранный где угодно,
  # подходит везде.
  #
  # build остаётся: локально образ по-прежнему строится одной командой, а на сервере
  # `up -d` без --build просто берёт уже загруженный образ этим именем.
  app:
    image: analizer-app:latest
    build: .
    container_name: analizer-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Внутри сети compose имя сервиса, а не localhost: порт 5433 на машине хоста
      # внутри контейнера другой.
      DB_URL: jdbc:postgresql://postgres:5432/analizer
      DB_USERNAME: analizer
      DB_PASSWORD: analizer
      # Разрешённые источники задаёт пользователь. Значение по умолчанию пустое:
      # без него приложение отвечает только своему источнику.
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    volumes:
      - analizer-gradle-cache:/root/.gradle

  # Веб-интерфейс для просмотра базы: http://localhost:5050
  # Логин: analizer@example.com, пароль: analizer (см. .env.example и README.md)
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: analizer-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-analizer@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-analizer}
      # Чтобы сервер подключался по внутренней сети compose, а не через localhost
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - analizer-pgadmin-data:/var/lib/pgadmin

volumes:
  analizer-pgdata:
  analizer-pgadmin-data:
  # Кэш Gradle для сборки образа. Без него каждая пересборка заново скачивает
  # зависимости, и сборка занимает минуты вместо секунд.
  analizer-gradle-cache: