services:
  postgres:
    image: postgres:17-alpine
    container_name: analizer-postgres
    environment:
      POSTGRES_DB: analizer
      POSTGRES_USER: analizer
      # Пароль обязателен: без него compose не запустится, а не возьмёт молчаливый
      # дефолт. Пароль базы и пароль приложения — одна и та же переменная DB_PASSWORD,
      # иначе пришлось бы держать в .env два значения, которые обязаны совпадать.
      #
      # ВАЖНО для существующей базы: том уже создан со старым паролем, и смена
      # переменной его не меняет — приложение перестанет подключаться. Новый пароль
      # действует только на чистом томе.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env — возьмите значение из .env.example}
    ports:
      # Только localhost: база не должна быть доступна из интернета.
      # Раньше здесь было "5433:5432" — это значит 0.0.0.0:5433, и PostgreSQL
      # был открыт наружу. Для проекта, где ключи OZON лежат в базе открытым
      # текстом, это главный риск: утечка дампа равна утечке всех аккаунтов.
      #
      # Порт по-прежнему нужен: к нему подключаются с самого сервера, а при
      # желании — через ssh-туннель:
      #   ssh -L 5433:127.0.0.1:5433 root@сервер
      #
      # ufw этого не решает: Docker публикует порты через свой iptables-чейн
      # DOCKER, который правила ufw обходят. Привязка к 127.0.0.1 — единственный
      # способ, который работает независимо от firewall.
      - "127.0.0.1:5433:5432"
    volumes:
      - analizer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analizer -d analizer"]
      interval: 5s
      timeout: 5s
      retries: 10

# Приложение: http://localhost:8080
  #
  # Собирается из исходников на сервере и дальше переиспользует кэш Gradle в томе.
  # Без этого тома каждая пересборка заново скачивает зависимости.
  #
  # TODO(#build-in-ci): перенести сборку образа в GitHub Actions. Пока сборка идёт
  # здесь, она берёт 2–4 ГБ RAM на пике, а на VPS с 2 ГБ это упирается в swap и
  # роняет сервер на несколько минут. Обоснование и варианты: docs/DEPLOY.md, 10.2.
  app:
    build: .
    container_name: analizer-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Внутри сети compose имя сервиса, а не localhost: порт 5433 на машине хоста
      # внутри контейнера другой.
      DB_URL: jdbc:postgresql://postgres:5432/analizer
      DB_USERNAME: analizer
      DB_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env — возьмите значение из .env.example}
      # Разрешённые источники задаёт пользователь. Значение по умолчанию пустое:
      # без него приложение отвечает только своему источнику.
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      # Тоже только localhost. Наружу приложение выставляет nginx
      # (/etc/nginx/conf.d/analizer.conf): он проксирует домен на этот порт.
      # Раньше здесь было "${APP_PORT:-8080}:8080", то есть 0.0.0.0 — приложение
      # было доступно из интернета напрямую, в обход nginx и его правил.
      #
      # Порт на машине задаётся переменной, а не зашит: у разных развёртываний он
      # разный (на сервере 8081, потому что 8080 занят Apache панели). Локально
      # порт тоже занят другим процессом, поэтому задаётся в .env.
      #
      # Health-check в деплое обращается сюда же, на 127.0.0.1 — привязка к
      # localhost его не ломает.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - analizer-gradle-cache:/root/.gradle

# Сервиса pgAdmin здесь намеренно нет.
#
# Он был локальным инструментом для просмотра базы, но стоил дороже, чем давал:
# образ около 450 МБ тянулся при каждом развёртывании, а на VPS с 2 ГБ RAM это
# место и трафик на ровно тот сервер, где ресурсов мало. Смотреть данные удобнее
# отчётом: `docker compose exec postgres psql -U analizer -d analizer`.
#
# Если инструмент всё-таки понадобится локально, не возвращать его в compose, а
# запустить отдельно — тогда его образ не попадёт в развёртывание:
#   docker run --rm -p 5050:80 -e PGADMIN_DEFAULT_EMAIL=... dpage/pgadmin4:9

volumes:
  analizer-pgdata:
  # Кэш Gradle для сборки образа. Без него каждая пересборка заново скачивает
  # зависимости, и сборка занимает минуты вместо секунд.
  analizer-gradle-cache: