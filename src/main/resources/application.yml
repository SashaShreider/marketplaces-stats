spring:
  application:
    name: analizer

  # Файл .env с настройками доступа к базе и таймаутами, если он есть. Опционален.
  # Реквизитов OZON в нём больше нет: их задаёт пользователь через API.
  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/analizer}
    username: ${DB_USERNAME:analizer}
    password: ${DB_PASSWORD:analizer}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: false
  web:
    error:
      include-message: always

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        # Lax и без Secure — чтобы работало на http://localhost:8080 без настроек.
        # Для публикации по HTTPS задайте COOKIE_SAME_SITE=None и COOKIE_SECURE=true:
        # иначе браузер не примет куку сессии и каждый запрос будет давать 401.
        same-site: ${COOKIE_SAME_SITE:Lax}
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

ozon:
  base-url: ${OZON_BASE_URL:https://api-seller.ozon.ru}
  connect-timeout: ${OZON_CONNECT_TIMEOUT:10s}
  read-timeout: ${OZON_READ_TIMEOUT:60s}
  max-retries: ${OZON_MAX_RETRIES:5}
  retry-backoff: ${OZON_RETRY_BACKOFF:2s}

sync:
  # Курсор last_id живёт 15 минут: если OZON его отверг, страницу перезапрашиваем с начала.
  max-page-retries: ${SYNC_MAX_PAGE_RETRIES:2}
  # Окно зрелости, дней. День считается окончательным, только если он старше окна:
  # начисления за свежие дни ещё приходят. Значение уточняется по статистике изменений.
  maturity-days: ${SYNC_MATURITY_DAYS:3}
  # Сколько ждать прерванную фоновую задачу при старте приложения.
  background-timeout-seconds: ${SYNC_BACKGROUND_TIMEOUT:30}

spring.task.execution.pool.core-size: 2
spring.task.execution.pool.max-size: 4
spring.task.execution.thread-name-prefix: sync-

logging:
  level:
    ru.analizer: INFO
    org.hibernate.SQL: WARN

app:
  # Источники, которым разрешено обращаться к API с куками. Пусто — приложение
  # работает только со своего источника, и CORS не нужен вовсе.
  # Для разработки, когда фронтенд запущен отдельно, добавьте, например:
  #   APP_ALLOWED_ORIGINS=http://localhost:5173
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:}
  cookie:
    # Те же параметры, что у server.servlet.session.cookie, но для куки XSRF-TOKEN.
    # Держать их разными незачем: обе куки живут рядом и уходят вместе с браузером.
    same-site: ${COOKIE_SAME_SITE:Lax}
    secure: ${COOKIE_SECURE:false}