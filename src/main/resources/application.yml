spring:
  application:
    name: analizer

  # Файл .env с реквизитами OZON, если он есть. Опционален: без него приложение
  # стартует, но запросы к OZON вернут 503 с понятным текстом.
  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/analizer}
    username: ${DB_USERNAME:analizer}
    password: ${DB_PASSWORD:analizer}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

ozon:
  base-url: ${OZON_BASE_URL:https://api-seller.ozon.ru}
  client-id: ${OZON_CLIENT_ID:}
  api-key: ${OZON_API_KEY:}
  connect-timeout: ${OZON_CONNECT_TIMEOUT:10s}
  read-timeout: ${OZON_READ_TIMEOUT:60s}
  max-retries: ${OZON_MAX_RETRIES:5}
  retry-backoff: ${OZON_RETRY_BACKOFF:2s}

sync:
  max-page-retries: ${SYNC_MAX_PAGE_RETRIES:2}

logging:
  level:
    ru.analizer: INFO
    org.hibernate.SQL: WARN
