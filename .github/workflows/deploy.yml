name: Deploy

# Публикация: коммит попал в main — сайт обновился.
#
# Образ собирается здесь, в CI, и приезжает на сервер готовым. Раньше он собирался
# на самом сервере, и это стоило дорого: сборка внутри Docker поднимает Gradle и npm,
# а на VPS с 2 ГБ памяти это означало либо OOM, либо сервер, недоступный несколько
# минут после каждого деплоя. Сборка переехала сюда, на сервере осталось распаковывание.
#
# Почему не реестр образов: аккаунт бесплатный, а квота GitHub на хранение пакетов —
# 500 МБ, при размере образа около 700 МБ он туда просто не поместился бы. Реестр
# имеет смысл, когда образов много и серверов несколько.

on:
  push:
    branches: [main]
  # Ручной запуск: вкладка Actions → Deploy → Run workflow.
  workflow_dispatch:

# Один деплой за раз. Параллельные деплои на одном сервере стали бы драться за один
# и тот же каталог и за один и тот же файл образа, и второй докончил бы работу
# поверх первого — на сервере остался бы образ, которого нет ни в одном коммите.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Имя образа одно и то же здесь и в docker-compose.yml. Если разойдутся, сервер
  # не найдёт образ и молча поднимет старый.
  IMAGE: analizer-app:latest
  # Файл образа во временной папке сервера. В системной не лежит: /tmp чистится
  # сам, и забитый им корень — это диск, за который платят.
  REMOTE_IMAGE_PATH: /tmp/analizer-app.tar.gz

jobs:
  build:
    name: Собрать образ
    runs-on: ubuntu-24.04
    outputs:
      # sha передаётся в шаг деплоя: он печатается в конце, и по нему видно, какой
      # именно коммит стоит на сервере.
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Какой коммит деплоим
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # buildx нужен для кэша слоёв. Без него каждый деплой качал бы заново Gradle и npm
      # и собирал образ минут на пять; с ним повторный деплой — около минуты.
      - name: Подготовка buildx
        uses: docker/setup-buildx-action@v3

      - name: Кэш слоёв
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      # Архив сжимается до отправки: несжатый образ занимает около 700 МБ, а по SSH
      # уходит примерно 250–300 МБ и заметно быстрее.
      - name: Упаковка образа
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          docker save "$IMAGE" | gzip -1 > /tmp/out/analizer-app.tar.gz
          echo "Размер образа после сжатия: $(du -h /tmp/out/analizer-app.tar.gz | cut -f1)"

  deploy:
    name: Обновить сайт на сервере
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Отправка образа на сервер
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: /tmp/out/analizer-app.tar.gz
          target: ${{ env.REMOTE_IMAGE_PATH }}
          strip_components: 1

      - name: Распаковка и запуск
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"

            # Собираем ровно то состояние, которое проверено в main, а не то, что было
            # пять минут назад. reset --hard вместо pull: рабочий каталог сервера не
            # должен хранить правки, иначе следующий деплой применит чужие.
            #
            # Это нужно и ради compose-файла: в нём имя образа, и без обновления
            # сервер поднимал бы то, что было записано при прошлом развёртывании.
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main

            # Образ грузится ДО запуска контейнеров, и только из присланного файла:
            # сначала поднимаем новый, и лишь потом заменяем старый. Наоборот — compose
            # успел бы стартовать со старым образом, и проверка живости ниже прошла бы
            # вовсе не по той версии, которую выкатили.
            echo "Загружаем образ…"
            gunzip -c "${{ env.REMOTE_IMAGE_PATH }}" | docker load
            rm -f "${{ env.REMOTE_IMAGE_PATH }}"

            # --build здесь нет намеренно: образ уже загружен, а сборка на сервере
            # съедала бы память машины на несколько минут. Собирать нужно только
            # если compose всё-таки решит, что образа нет, — тогда деплой упадёт на
            # проверке живости, и это лучше, чем молча поднять старый образ.
            docker compose up -d --no-build app

            # Миграции Flyway применяются сами при старте приложения — отдельного шага
            # для них не нужно. Их применимость проверяет задание integration в ci.yml.
            echo "Ждём, пока приложение ответит…"
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Приложение поднялось за $((i * 5)) секунд"
                echo "Интерфейс отвечает: $(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
                echo "Готово: ${{ needs.build.outputs.sha }}"
                docker image inspect $IMAGE --format 'Образ: {{.Id}} ({{.Created}})'
                exit 0
              fi
              sleep 5
            done

            echo "Приложение не поднялось за 200 секунд. Логи:"
            docker compose logs --tail 100 app
            exit 1