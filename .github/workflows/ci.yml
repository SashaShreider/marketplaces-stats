name: CI

# Проверки на каждом пуше и на каждом pull request. Задача одна — не дать в main
# код, который не собирается и не проходит тесты: деплой собирает образ из main,
# и ошибка обнаружилась бы уже на сервере.

on:
  push:
    # dev тоже: без этого ошибочный код обнаружился бы только в момент создания
    # pull request, а не сразу после пуша. main проверяется по той же причине —
    # пуш в него и есть событие, из которого запускается деплой.
    branches: [main, dev]
  pull_request:

# Новый коммит отменяет предыдущий прогон этой же ветки: он всё равно стал неактуальным,
# а очередь из старых проверок только задерживает результат.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Тесты backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Кэш Gradle: без него каждая проверка заново скачивает зависимости, и она
      # идёт минуты вместо секунд.
      - name: Кэш Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # gradlew в репозитории сохранён без бита исполнения (100644): Dockerfile
      # компенсирует это своим chmod, а в CI без него ./gradlew падает с кодом 126
      # («permission denied»), и до тестов дело не доходит вовсе.
      - name: Права на gradlew
        run: chmod +x gradlew

      # -Pfast исключает интеграционные тесты (*IT): они поднимают Testcontainers
      # с PostgreSQL и занимают больше десяти минут. Полный прогон — отдельным
      # заданием ниже, потому что на каждый PR он слишком дорог.
      - name: Модульные тесты
        run: ./gradlew test -Pfast --console=plain

      # Контракт проверяется тестом, но пересобирать docs/openapi.json нужно явно:
      # иначе тест упадёт на расхождении, и это правильно — он для того и нужен.
      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Контракт API совпадает с живым
        run: ./gradlew test --tests=ru.analizer.contract.OpenApiContractIT --console=plain

  frontend:
    name: Проверки frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      # Типы интерфейса сверяются с машинным контрактом. Если сервер изменил
      # ответ, а типы интерфейса — нет, сборка падает здесь, а не в браузере.
      - name: Типы соответствуют контракту
        run: npm run gen:types && git diff --exit-code -- src/api/schema.d.ts

      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка
        run: npm run build

  # Полный прогон с интеграционными тестами: он поднимает Testcontainers с
  # PostgreSQL, поэтому запускается на каждый PR, но не блокирует быстрые проверки.
  integration:
    name: Интеграционные тесты (полный прогон)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Кэш Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # В CI ничего не переимпортируется: миграции Flyway накатываются на чистую базу
      # внутри контейнера, и это проверяет, что миграции вообще применимы.
      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Полный прогон
        run: ./gradlew test --console=plain