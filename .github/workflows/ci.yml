name: CI

# Проверки и публикация в одном файле, потому что публикация зависит от проверок:
# задание deploy не может стартовать, пока все три проверки не зелёные (needs).
# Пока это были два файла, деплой стартовал одновременно с тестами и мог выкатить
# код, который через минуту упал бы в CI.

on:
  push:
    # dev тоже: без этого ошибочный код обнаружился бы только в момент создания
    # pull request, а не сразу после пуша. main проверяется по той же причине — и
    # вдобавок его проверки служат воротами перед деплоем.
    branches: [main, dev]
  pull_request:
    # PR, который вливается в main, проверок не запускает: тот же самый код уже
    # прошёл полный прогон при пуше в dev, и повторять его — платить дважды за
    # один результат. Фильтр именно по целевой ветке PR, поэтому PR в dev и
    # вложенные PR между feature-ветками проверяются как раньше.
    branches-ignore: [main]
  # Ручной запуск: вкладка Actions → CI → Run workflow. Нужен, чтобы прогнать
  # проверки без коммита и, если отмечен флажок, выкатить main на сервер руками.
  workflow_dispatch:
    inputs:
      deploy:
        description: 'После проверок выкатить сервер (работает только на ветке main)'
        type: boolean
        default: false

# Новый коммит отменяет предыдущий прогон этой же ветки: он всё равно стал неактуальным,
# а очередь из старых проверок только задерживает результат.
#
# На main отмена выключена: в том же прогоне живёт задание deploy, и оборвать его на
# середине значит оставить контейнер недособранным. Два пуша подряд дают два прогона,
# и деплои выстраиваются в очередь своим заданием (см. concurrency у deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Тесты backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Кэш Gradle: без него каждая проверка заново скачивает зависимости, и она
      # идёт минуты вместо секунд.
      - name: Кэш Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # gradlew в репозитории сохранён без бита исполнения (100644): Dockerfile
      # компенсирует это своим chmod, а в CI без него ./gradlew падает с кодом 126
      # («permission denied»), и до тестов дело не доходит вовсе.
      - name: Права на gradlew
        run: chmod +x gradlew

      # -Pfast исключает интеграционные тесты (*IT): они поднимают Testcontainers
      # с PostgreSQL и занимают больше десяти минут. Полный прогон — отдельным
      # заданием ниже, потому что на каждый PR он слишком дорог.
      - name: Модульные тесты
        run: ./gradlew test -Pfast --console=plain

      # Контракт проверяется тестом, но пересобирать docs/openapi.json нужно явно:
      # иначе тест упадёт на расхождении, и это правильно — он для того и нужен.
      - name: Контракт API совпадает с живым
        run: ./gradlew test --tests=ru.analizer.contract.OpenApiContractIT --console=plain

  frontend:
    name: Проверки frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      # Типы интерфейса сверяются с машинным контрактом. Если сервер изменил
      # ответ, а типы интерфейса — нет, сборка падает здесь, а не в браузере.
      - name: Типы соответствуют контракту
        run: npm run gen:types && git diff --exit-code -- src/api/schema.d.ts

      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка
        run: npm run build

  # Полный прогон с интеграционными тестами: он поднимает Testcontainers с
  # PostgreSQL, поэтому запускается на каждый PR, но не блокирует быстрые проверки.
  integration:
    name: Интеграционные тесты (полный прогон)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Кэш Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # В CI ничего не переимпортируется: миграции Flyway накатываются на чистую базу
      # внутри контейнера, и это проверяет, что миграции вообще применимы.
      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Полный прогон
        run: ./gradlew test --console=plain

  # Публикация: коммит попал в main — сайт обновился.
  #
  # Сборка образа идёт на сервере, а не здесь. Для одного сервера это проще и надёжнее
  # передачи готового образа: не нужен реестр образов, не нужны логины в него, а кэш
  # Gradle и npm живёт в томах на самом сервере и переиспользуется между деплоями.
  # Плата — две-четыре минуты сборки на каждый деплой.
  #
  # TODO(#build-in-ci): перенести сборку сюда, а на сервере оставить только запуск
  # готового образа. Сейчас это осознанное решение, а не недоделанная работа:
  # проверяем, хватает ли VPS ресурсов. Переносить имеет смысл, только если упрёмся:
  # сборка берёт 2–4 ГБ RAM на пике, и на машине с 2 ГБ это значит swap и несколько
  # минут недоступного сервера после каждого деплоя. Обоснование и варианты
  # (GHCR против docker save + ssh): docs/DEPLOY.md, раздел 10.2.
  deploy:
    name: Обновить сайт на сервере
    # Главная причина, по которой деплой живёт в этом файле: needs. Пока это было
    # отдельное задание в deploy.yml, оно стартовало параллельно с тестами, и
    # красный CI не мешал выкатить сломанный код.
    needs: [backend, frontend, integration]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    runs-on: ubuntu-24.04
    # Своя группа: параллельные деплои на одном сервере стали бы драться за один и
    # тот же каталог, и второй докончил бы работу поверх первого. Отменять идущий
    # деплой нельзя — на середине он оставит контейнер недособранным.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Подключение к серверу
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"

            # Собираем ровно то состояние, которое проверено в main, а не то, что
            # было пять минут назад. checkout -f -B вместо простого checkout:
            # после git fetch на detached HEAD или без локальной ветки main простой
            # checkout main падает, и деплой останавливается на ровном месте.
            git fetch --prune origin
            git checkout -f -B main origin/main
            git reset --hard origin/main

            # Миграции Flyway применяются сами при старте приложения — отдельного
            # шага для них не нужно. Отдельной базы для проверки миграций на сервере
            # тоже не нужно: их применимость проверяет задание integration.
            docker compose up -d --build app

            # Проверка живости. Без неё деплой считался бы успешным и при упавшем
            # приложении, а заметить это можно было бы только по жалобам.
            echo "Ждём, пока приложение ответит…"
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Приложение поднялось за $((i * 5)) секунд"
                echo "Интерфейс отвечает: $(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
                echo "Готово: $(git rev-parse --short HEAD)"
                exit 0
              fi
              sleep 5
            done

            echo "Приложение не поднялось за 200 секунд. Логи:"
            docker compose logs --tail 100 app
            exit 1
